<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kickabout — account</title>
  <meta name="theme-color" content="#14532d" />
  <link rel="icon" href="/play/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/site.css" />
  <script src="/config.js"></script>
  <script type="module" src="/site.js"></script>
  <script type="module" src="/account.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="/" aria-label="Kickabout">KICKAB<svg class="ball" viewBox="-50 -50 100 100" aria-hidden="true"><defs><clipPath id="ball-clip"><circle r="46"/></clipPath></defs><circle r="46" fill="#fff"/><g clip-path="url(#ball-clip)" fill="#111"><polygon points="0.0,-16.0 15.2,-4.9 9.4,12.9 -9.4,12.9 -15.2,-4.9"/><polygon points="0.0,-34.0 -12.4,-43.0 -7.6,-57.5 7.6,-57.5 12.4,-43.0"/><polygon points="32.3,-10.5 37.1,-25.0 52.3,-25.0 57.1,-10.5 44.7,-1.5"/><polygon points="20.0,27.5 35.3,27.5 40.0,42.0 27.6,51.0 15.3,42.0"/><polygon points="-20.0,27.5 -15.3,42.0 -27.6,51.0 -40.0,42.0 -35.3,27.5"/><polygon points="-32.3,-10.5 -44.7,-1.5 -57.1,-10.5 -52.3,-25.0 -37.1,-25.0"/><path d="M0.0 -16.0L0.0 -36.0 M15.2 -4.9L34.2 -11.1 M9.4 12.9L21.2 29.1 M-9.4 12.9L-21.2 29.1 M-15.2 -4.9L-34.2 -11.1" stroke="#333" stroke-width="2.5"/></g><circle r="46" fill="none" stroke="#111" stroke-width="4"/></svg>UT</a>
      <nav>
        <a href="/play/" data-i18n="nav_play">Play</a>
        <a href="/kibic.html" data-i18n="nav_live">Fan zone</a>
        <a href="/#download" class="hide-sm" data-i18n="nav_download">Download</a>
        <a href="/account.html" id="account-link" data-i18n="nav_signin">Sign in</a>
        <select class="lang" aria-label="Language"><option value="en">EN</option><option value="pl">PL</option></select>
      </nav>
    </div>
  </header>

  <main class="account">
    <div class="notice" id="notice" hidden role="status"></div>

    <!-- Signed out -->
    <div id="signin" hidden>
      <h1 data-i18n="acc_signin_title">Sign in</h1>
      <p class="muted" data-i18n="acc_signin_lead"></p>
      <div class="card providers" id="providers"></div>
    </div>

    <!-- Signed in -->
    <div id="me" hidden>
      <h1 data-i18n="acc_title">Your account</h1>
      <div class="card profile"><img id="avatar" alt="" /><div><div class="name" id="name"></div><div class="muted" id="email"></div></div></div>

      <div class="card">
        <h3 data-i18n="club_title">My online club</h3>
        <p><strong id="club"></strong> <span class="muted" id="coins"></span></p>
        <a class="btn primary" href="/play/?club" data-i18n="club_manage">Manage the club in the game</a>
      </div>

      <div class="card">
        <h3 data-i18n="app_title">Connect the app</h3>
        <p class="muted" data-i18n="app_lead"></p>
        <div class="cta"><button class="btn" id="app-code" data-i18n="app_btn">Show a code</button> <span class="code" id="code"></span></div>
      </div>

      <div class="card">
        <h3 data-i18n="acc_name">Display name</h3>
        <form class="inline" id="rename"><input type="text" id="name-input" maxlength="40" required autocomplete="nickname" /><button class="btn primary" data-i18n="save">Save</button></form>
      </div>

      <div class="card">
        <h3 data-i18n="acc_linked">Sign-in methods</h3>
        <ul class="rows" id="identities"></ul>
      </div>

      <div class="card">
        <h3 data-i18n="acc_sessions">Signed-in devices</h3>
        <ul class="rows" id="sessions"></ul>
        <div class="cta"><button class="btn ghost" id="logout-others" data-i18n="signout_others"></button><button class="btn" id="logout" data-i18n="signout"></button></div>
      </div>

      <div class="card">
        <h3 data-i18n="danger">Delete account</h3>
        <p class="muted" data-i18n="danger_lead"></p>
        <div class="cta"><button class="btn danger" id="delete" data-i18n="delete"></button></div>
      </div>
    </div>
  </main>
</body>
</html>
