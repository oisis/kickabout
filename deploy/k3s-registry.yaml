# A minimal image registry for local K3s: docker pushes to localhost:30500 and the node
# pulls from it (containerd allows plain HTTP for localhost). Images are kept on a volume.
apiVersion: v1
kind: Namespace
metadata: { name: registry }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: registry-data, namespace: registry }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: registry, namespace: registry }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: registry } }
  template:
    metadata: { labels: { app: registry } }
    spec:
      containers:
        - name: registry
          image: registry:3
          env: [{ name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }]
          ports: [{ containerPort: 5000 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/registry }]
          readinessProbe: { httpGet: { path: /v2/, port: 5000 } }
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 256Mi } }
      volumes: [{ name: data, persistentVolumeClaim: { claimName: registry-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: registry, namespace: registry }
spec:
  type: NodePort
  selector: { app: registry }
  ports: [{ port: 5000, targetPort: 5000, nodePort: 30500 }]
