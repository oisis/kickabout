{{- $sel := dict "root" . "component" "api" }}
{{- if not .Values.api.oauth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kickabout.oauthSecret" . }}
  labels: {{- include "kickabout.labels" . | nindent 4 }}
type: Opaque
stringData:
  GOOGLE_CLIENT_ID: {{ .Values.api.oauth.googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.api.oauth.googleClientSecret | quote }}
  GITHUB_CLIENT_ID: {{ .Values.api.oauth.githubClientId | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.api.oauth.githubClientSecret | quote }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-api-data
  labels: {{- include "kickabout.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep # accounts survive helm uninstall
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.api.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.api.persistence.size }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "kickabout.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: 1 # SQLite + in-memory match lobby: one instance
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "kickabout.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kickabout.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/oauth: {{ toJson .Values.api.oauth | sha256sum }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8787 }]
          env:
            - { name: PUBLIC_URL, value: {{ .Values.publicUrl | quote }} }
            - { name: API_URL, value: {{ .Values.apiUrl | quote }} }
            - { name: COOKIE_DOMAIN, value: {{ .Values.cookieDomain | quote }} }
            - { name: DEV_LOGIN, value: {{ ternary "1" "0" .Values.api.devLogin | quote }} }
          envFrom: [{ secretRef: { name: {{ include "kickabout.oauthSecret" . }} } }]
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 30 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ .Release.Name }}-api-data }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "kickabout.labels" . | nindent 4 }}
spec:
  selector: {{- include "kickabout.selector" $sel | nindent 4 }}
  ports: [{ name: http, port: 8787, targetPort: http }]
