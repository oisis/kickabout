{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "kickabout.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls: [{ hosts: [{{ .Values.ingress.host | quote }}{{ with .Values.ingress.apiHost }}, {{ . | quote }}{{ end }}], secretName: {{ .Values.ingress.tls.secretName }} }]
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # The website proxies /api and /ws to the API service, so one backend serves everything.
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-web, port: { name: http } } }
    {{- with .Values.ingress.apiHost }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ $.Release.Name }}-api, port: { name: http } } }
    {{- end }}
{{- end }}
