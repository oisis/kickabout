# Public address of the website.
publicUrl: https://www.example.pl
# Optional API subdomain, e.g. https://api.example.pl (set ingress.apiHost too). Empty: the API
# lives behind the website at <publicUrl>/api. OAuth redirect URIs:
#   with apiUrl:    <apiUrl>/auth/{google,github}/callback
#   without:        <publicUrl>/api/auth/{google,github}/callback
apiUrl: ""
# Cookie domain shared by the website and the API subdomain (e.g. example.pl); empty without apiUrl.
cookieDomain: ""

api:
  image: { repository: ghcr.io/oisis/kickabout-api, tag: "", pullPolicy: IfNotPresent } # tag "" = the chart's appVersion
  # SQLite on a ReadWriteOnce volume: keep a single replica.
  persistence:
    size: 1Gi
    storageClass: ""        # "" = cluster default
  devLogin: false           # name-only sign-in for testing; never enable in production
  # Administrators (website /admin.html): e-mails of their Google/GitHub accounts.
  adminEmails: []           # e.g. [me@example.com]
  # OAuth credentials. Either set them here (stored in a chart Secret) or name an existing
  # Secret with keys GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET.
  oauth:
    existingSecret: ""
    googleClientId: ""
    googleClientSecret: ""
    githubClientId: ""
    githubClientSecret: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# For private GHCR packages: a docker-registry Secret, e.g. kubectl create secret docker-registry ghcr-pull-secret ...
imagePullSecrets: []   # - name: ghcr-pull-secret

web:
  image: { repository: ghcr.io/oisis/kickabout-web, tag: "", pullPolicy: IfNotPresent }
  replicas: 2
  # NodePort exposes the site over plain HTTP on every node (e.g. phones on the LAN without the ingress).
  service: { type: ClusterIP, nodePort: null }
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }

# Voice chat (private rooms): STUN finds a direct path; TURN relays when there is none.
voice:
  stun: [stun:stun.l.google.com:19302]

turn:
  enabled: false
  image: coturn/coturn:4.6.3
  externalIp: ""          # public IP of the node clients reach
  port: 3478
  minPort: 49160          # relay ports (UDP) to open in the firewall
  maxPort: 49200
  secret: ""              # shared with the API; clients get credentials valid for an hour
  urls: []                # e.g. [turn:turn.example.pl:3478?transport=udp, turn:turn.example.pl:3478?transport=tcp]
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }

# Prometheus: GET /metrics on the API service (port 8787). It is not reachable through the website
# (only /api and /ws are proxied); with a public API subdomain set a token.
metrics:
  token: ""                 # optional Bearer token required by /metrics (stored in a chart Secret)
  annotations: true         # prometheus.io/scrape|port|path on the API Service (annotation-based discovery)
  serviceMonitor:           # Prometheus Operator / kube-prometheus-stack
    enabled: false
    interval: 30s
    labels: {}              # e.g. { release: kube-prometheus-stack } to match the operator's selector

ingress:
  enabled: true
  className: nginx
  host: www.example.pl
  apiHost: ""          # e.g. api.example.pl (routes straight to the API service)
  annotations:
    # Online matches keep a WebSocket open for the whole game.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # cert-manager.io/cluster-issuer: letsencrypt
  tls:
    enabled: false
    secretName: kickabout-tls
