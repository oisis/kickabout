<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14532d" />
    <title>Kickabout</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <style>
      :root { --bg: #14532d; --panel: rgba(6, 30, 15, 0.92); --fg: #f8fafc; --muted: #a7c4b0; --accent: #facc15; --line: rgba(255, 255, 255, 0.14); }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; overscroll-behavior: none; font: 16px/1.35 system-ui, sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; touch-action: none; user-select: none; -webkit-user-select: none; }
      #ui { position: fixed; inset: 0; overflow-y: auto; background: var(--panel); padding: max(16px, env(safe-area-inset-top)) 16px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; align-items: stretch; max-width: 640px; margin: 0 auto; }
      #ui[hidden] { display: none; }
      .logo { font: 900 clamp(44px, 14vw, 72px) system-ui, sans-serif; color: var(--accent); text-align: center; margin: 4vh 0 2vh; text-shadow: 0 4px 0 #000; letter-spacing: 1px; }
      header h1 { margin: 6px 0 0; font-size: 26px; }
      header .sub, .sub { margin: 2px 0 6px; color: var(--muted); }
      nav { display: flex; flex-direction: column; gap: 10px; }
      button { font: 700 17px system-ui, sans-serif; padding: 13px 16px; border-radius: 12px; border: 0; background: #1f6b3a; color: var(--fg); cursor: pointer; }
      button.primary { background: var(--accent); color: #1c1917; }
      button.big { padding: 17px; font-size: 19px; }
      button.ghost { background: transparent; border: 1px solid var(--line); }
      button:active { transform: translateY(1px); }
      .row { display: flex; gap: 10px; flex-wrap: wrap; }
      .row > * { flex: 1; }
      .field { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
      .field select, .field input { font: 16px system-ui, sans-serif; padding: 11px; border-radius: 10px; border: 1px solid var(--line); background: #0b2a17; color: var(--fg); }
      .field.check { flex-direction: row; align-items: center; gap: 10px; color: var(--fg); font-size: 16px; padding: 6px 0; }
      .field.check input { width: 22px; height: 22px; accent-color: var(--accent); }
      table { border-collapse: collapse; width: 100%; font-size: 13px; }
      th, td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
      td:nth-child(2), th:nth-child(2) { text-align: left; }
      td:nth-child(3) { text-align: left; white-space: normal; }
      tr.click { cursor: pointer; }
      tr.hl { background: rgba(250, 204, 21, 0.25); }
      .score { font-size: 24px; font-weight: 800; text-align: center; margin: 8px 0; }
      .scorers { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; font-size: 14px; }
      .scorers .away { grid-column: 2; text-align: right; }
      .scorers .home { grid-column: 1; }
      .list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
      .list li { display: flex; gap: 8px; align-items: center; background: rgba(255, 255, 255, 0.05); border-radius: 10px; padding: 6px 8px; }
      .list li span { flex: 1; }
      .list li button { padding: 8px 12px; }
      .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
      h3 { margin: 10px 0 2px; font-size: 16px; color: var(--accent); }
      .msg { margin: 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: rgba(250, 204, 21, 0.08); font-size: 14px; }
      .colors { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
      .colors input[type=color] { width: 100%; height: 40px; padding: 2px; border-radius: 8px; border: 1px solid var(--line); background: none; }
      table.edit input, table.edit select { width: 100%; box-sizing: border-box; font: 14px system-ui, sans-serif; padding: 6px 2px; background: #0b2a17; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; }
      table.edit td:first-child { min-width: 110px; }
      table.edit input.num { width: 34px; text-align: center; }
      .mini-pitch { position: relative; aspect-ratio: 68 / 105; width: min(100%, calc(62vh * 68 / 105)); margin: 0 auto; box-sizing: border-box; background: repeating-linear-gradient(0deg, #2a8235 0 10%, #2f8f3a 10% 20%); border: 2px solid #fff; border-radius: 4px; touch-action: none; }
      .mini-pitch .half { position: absolute; left: 0; right: 0; top: 50%; border-top: 2px dashed rgba(255,255,255,.6); }
      .dot { position: absolute; width: 34px; height: 34px; margin: 0 0 -17px -17px; border-radius: 50%; background: #dc2626; border: 2px solid #fff; display: grid; place-items: center; font-weight: 800; touch-action: none; cursor: grab; }
      .dot.keeper { background: #22c55e; cursor: default; }
      .presets { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
      .presets button { padding: 11px 8px; font-size: 15px; }
      .hint { color: var(--muted); font-size: 13px; text-align: center; }
      .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 10; }
      /* Phones held sideways: compact header and two columns of buttons. */
      @media (orientation: landscape) and (max-height: 520px) {
        #ui { max-width: 860px; padding-top: max(8px, env(safe-area-inset-top)); gap: 8px; }
        .logo { font-size: 36px; margin: 4px 0; }
        nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { padding: 10px 14px; }
        button.big { padding: 12px; font-size: 17px; }
        header h1 { font-size: 22px; }
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <div id="ui" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
